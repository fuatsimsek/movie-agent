<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07070F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="700" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#DEAB52" font-family="sans-serif">
    🎬 Movie Agent — System Architecture
  </text>

  <!-- Layer 1: Input -->
  <rect x="50" y="80" width="1300" height="80" rx="8" fill="#111127" stroke="#C8871A" stroke-width="2" opacity="0.8"/>
  <text x="700" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#DEAB52">
    INPUT: User Emotion (Turkish text)
  </text>
  <text x="700" y="135" font-size="14" text-anchor="middle" fill="#9a9aaa">
    "Çok mutsuzum, derin bir film istiyorum..." (min 10 chars)
  </text>

  <!-- Arrow Down 1 -->
  <line x1="700" y1="160" x2="700" y2="190" stroke="#C8871A" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#C8871A" />
    </marker>
  </defs>

  <!-- Layer 1: Emotion Analysis -->
  <g filter="url(#glow)">
    <rect x="50" y="190" width="1300" height="100" rx="8" fill="#0c1825" stroke="#4fc3f7" stroke-width="2"/>
  </g>
  <text x="150" y="220" font-size="16" font-weight="bold" fill="#4fc3f7">LAYER 1: EMOTION ANALYSIS</text>
  <text x="150" y="245" font-size="12" fill="#9a9aaa">Model: llama3.1:8b (base)</text>
  <text x="150" y="265" font-size="12" fill="#9a9aaa">Output: energy_level | mood_valence | needs | avoid</text>
  <rect x="1050" y="200" width="250" height="80" rx="6" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1175" y="220" font-size="11" font-weight="bold" text-anchor="middle" fill="#4fc3f7">Example Output</text>
  <text x="1175" y="240" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">energy: low</text>
  <text x="1175" y="255" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">valence: negative</text>
  <text x="1175" y="270" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">needs: emotional rest</text>

  <!-- Arrow Down 2 -->
  <line x1="700" y1="290" x2="700" y2="320" stroke="#C8871A" stroke-width="2"/>

  <!-- Layer 2: Recommendation -->
  <g filter="url(#glow)">
    <rect x="50" y="320" width="1300" height="100" rx="8" fill="#0c2527" stroke="#81c784" stroke-width="2"/>
  </g>
  <text x="150" y="350" font-size="16" font-weight="bold" fill="#81c784">LAYER 2: FILM RECOMMENDATION</text>
  <text x="150" y="375" font-size="12" fill="#9a9aaa">Model: llama3.1:8b (base)</text>
  <text x="150" y="395" font-size="12" fill="#9a9aaa">Output: title | year | type | plot | reason</text>
  <rect x="1050" y="330" width="250" height="80" rx="6" fill="#1a1a2e" stroke="#81c784" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1175" y="350" font-size="11" font-weight="bold" text-anchor="middle" fill="#81c784">Example Output</text>
  <text x="1175" y="370" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">title: "Black Swan"</text>
  <text x="1175" y="385" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">year: 2010</text>
  <text x="1175" y="400" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">plot: "A perfectionist..."</text>

  <!-- Arrow Down 3 -->
  <line x1="700" y1="420" x2="700" y2="450" stroke="#C8871A" stroke-width="2"/>

  <!-- Layer 3: Genre Classification -->
  <g filter="url(#glow)">
    <rect x="50" y="450" width="1300" height="100" rx="8" fill="#1a0f0c" stroke="#ff9800" stroke-width="2"/>
  </g>
  <text x="150" y="480" font-size="16" font-weight="bold" fill="#ff9800">LAYER 3: GENRE CLASSIFICATION</text>
  <text x="150" y="505" font-size="12" fill="#9a9aaa">Model: movie-agent (fine-tuned, Ollama Modelfile)</text>
  <text x="150" y="525" font-size="12" fill="#9a9aaa">Output: genres (1–3 tags)</text>
  <rect x="1050" y="460" width="250" height="80" rx="6" fill="#1a1a2e" stroke="#ff9800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1175" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="#ff9800">Example Output</text>
  <text x="1175" y="500" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">genres:</text>
  <text x="1175" y="517" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">["drama", "psycho"]</text>
  <text x="1175" y="532" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">"psychological"</text>

  <!-- Arrow Down 4 -->
  <line x1="700" y1="550" x2="700" y2="580" stroke="#C8871A" stroke-width="2"/>

  <!-- Layer 4: Mood Mapping -->
  <g filter="url(#glow)">
    <rect x="50" y="580" width="1300" height="100" rx="8" fill="#0c0c1a" stroke="#ba68c8" stroke-width="2"/>
  </g>
  <text x="150" y="610" font-size="16" font-weight="bold" fill="#ba68c8">LAYER 4: MOOD MAPPING</text>
  <text x="150" y="635" font-size="12" fill="#9a9aaa">Data: mood_map.json (genre → mood, deterministic)</text>
  <text x="150" y="655" font-size="12" fill="#9a9aaa">Output: detected_moods (5 categories)</text>
  <rect x="1050" y="590" width="250" height="80" rx="6" fill="#1a1a2e" stroke="#ba68c8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1175" y="610" font-size="11" font-weight="bold" text-anchor="middle" fill="#ba68c8">Example Output</text>
  <text x="1175" y="630" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">moods:</text>
  <text x="1175" y="647" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">["emotional",</text>
  <text x="1175" y="662" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">"thought-provoking"]</text>

  <!-- Arrow Down 5 -->
  <line x1="700" y1="680" x2="700" y2="710" stroke="#C8871A" stroke-width="2"/>

  <!-- Layer 5: Film Selection (NEW) -->
  <g filter="url(#glow)">
    <rect x="50" y="710" width="1300" height="100" rx="8" fill="#0c1a0c" stroke="#66bb6a" stroke-width="2.5" fill-opacity="0.9"/>
  </g>
  <text x="150" y="740" font-size="16" font-weight="bold" fill="#66bb6a">LAYER 5: FILM SELECTION (Backend Filtering)</text>
  <text x="150" y="765" font-size="12" fill="#9a9aaa">Data: FILM_LIBRARY (30 curated films with moods)</text>
  <text x="150" y="785" font-size="12" fill="#66bb6a" font-weight="bold">⭐ NEW: Guaranteed film from library (no hallucination)</text>
  <rect x="1050" y="720" width="250" height="80" rx="6" fill="#1a1a2e" stroke="#66bb6a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1175" y="740" font-size="11" font-weight="bold" text-anchor="middle" fill="#66bb6a">Example Output</text>
  <text x="1175" y="760" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">Selected Film:</text>
  <text x="1175" y="777" font-size="10" text-anchor="middle" fill="#9a9aaa" font-family="monospace">"Black Swan" (2010)</text>
  <text x="1175" y="792" font-size="9" text-anchor="middle" fill="#66bb6a">from FILM_LIBRARY</text>

  <!-- Arrow Down 6 -->
  <line x1="700" y1="810" x2="700" y2="840" stroke="#C8871A" stroke-width="2"/>

  <!-- Output -->
  <rect x="50" y="840" width="1300" height="100" rx="8" fill="#111127" stroke="#C8871A" stroke-width="2" opacity="0.8"/>
  <text x="700" y="870" font-size="18" font-weight="bold" text-anchor="middle" fill="#DEAB52">
    OUTPUT: Film + Poster + Pipeline Visualization
  </text>
  <text x="700" y="895" font-size="14" text-anchor="middle" fill="#9a9aaa">
    React UI with TMDB poster (fallback: SVG → text placeholder)
  </text>

  <!-- Legend -->
  <g>
    <text x="50" y="960" font-size="13" font-weight="bold" fill="#DEAB52">Key Points:</text>
    <text x="50" y="983" font-size="11" fill="#9a9aaa">• 5 layers ensure transparency and debuggability</text>
    <text x="400" y="983" font-size="11" fill="#9a9aaa">• Layer 5 filters guarantees 30 films (no hallucination)</text>
    <text x="900" y="983" font-size="11" fill="#9a9aaa">• Fully offline (Ollama local)</text>
  </g>

  <!-- Tech Stack Box -->
  <rect x="50" y="50" width="180" height="25" rx="4" fill="#1a1a2e" stroke="#C8871A" stroke-width="1" opacity="0.7"/>
  <text x="140" y="68" font-size="11" text-anchor="middle" fill="#DEAB52" font-weight="bold">Tech: Flask + React + Ollama</text>
</svg>