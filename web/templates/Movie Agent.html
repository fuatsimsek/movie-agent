<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Agent — Film AI</title>

  <!-- TMDB CDN optimization -->
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>

  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* ─── fs-10 helper (not in rem scale) ─── */
    .fs-10 { font-size: 0.625rem; }
    /* ─── Prevent FOUC ─── */
    #root { opacity: 0; transition: opacity 0.3s; }
    #root.ready { opacity: 1; }
  </style>

  <!-- Thumbnail for standalone bundler -->
  <template id="__bundler_thumbnail" data-bg-color="#07070F">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#07070F"/>
      <rect x="460" y="280" width="280" height="240" rx="16" fill="#0C0C1B" stroke="#C8871A" stroke-width="1.5" stroke-opacity="0.4"/>
      <!-- film icon -->
      <rect x="500" y="320" width="200" height="160" rx="8" fill="none" stroke="#C8871A" stroke-width="2"/>
      <line x1="500" y1="360" x2="700" y2="360" stroke="#C8871A" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="500" y1="400" x2="700" y2="400" stroke="#C8871A" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="500" y1="440" x2="700" y2="440" stroke="#C8871A" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="600" y="550" font-family="sans-serif" font-size="28" fill="#DEAB52" text-anchor="middle" font-weight="700">Movie Agent</text>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel (pinned, integrity-checked) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <!-- Design system components (load order matters) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="analyzer.jsx"></script>
  <script type="text/babel" src="result-modal.jsx"></script>
  <script type="text/babel" src="detail-screen.jsx"></script>
  <script type="text/babel" src="tweaks-config.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- Reveal root after mount -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('root').classList.add('ready'), 120);
    });
  </script>
</body>
</html>
